name: Test Insighta Labs+

on:
  pull_request:
    branches:
      - main

jobs:
   test:
    runs-on: ubuntu-latest
    container: 
      image: node:22
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build